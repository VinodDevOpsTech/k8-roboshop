apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mongodb
spec:
  # modify replicas according to your case
  replicas: 10
  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: mongodb
  #pods
  template:
    metadata:
      name: nginx
      labels:
        project: roboshop
        tier: db
        component: mongodb
    spec:
      containers:
      - name: mongodb
        image: maxdevopstech/mongodb:4.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mongodb
spec:
  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: mongodb
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27027


